[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Custom markers — used to select/skip test tiers.
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    e2e: end-to-end tests with Playwright (require running server + browser)
    load: Locust load tests (run separately via `locust` CLI)
    schema: Schemathesis contract tests (slow — fuzzes entire OpenAPI schema)
    security: security/hacker simulation tests
    property: Hypothesis property-based tests

# Default behavior: run all tests EXCEPT the very slow tiers.
# To run a specific tier:
#   pytest tests/property/         # fast property tests
#   pytest tests/security/         # security tests
#   pytest tests/e2e/ -m e2e       # e2e (requires server + browser)
#   pytest tests/schema/ -m schema # schemathesis (very slow)
#   locust -f tests/load/locustfile.py  # load tests (separate CLI)
