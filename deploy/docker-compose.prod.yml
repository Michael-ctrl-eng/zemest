# =============================================================================
# Zemest — CANONICAL production stack (single host, 10K users/day)
# =============================================================================
# This is the ONE prod compose. (The older repos/zemest/docker-compose.prod.yml
# was removed — same topology, nginx edge, manual certs; superseded.)
#
# Shape:
#   caddy       — TLS (auto via Let's Encrypt), rate limiting, routing
#   web         — Next.js frontend + BFF (cookies/CSRF live HERE, not at the
#                 backend; Cookie→Bearer translation inside the BFF)
#   api x2      — FastAPI replicas, NO scheduler, NO queue consumer: they
#                 enqueue to the shared Huey file and serve requests only
#   scheduler   — the ONLY replica running APScheduler jobs (publish sweep,
#                 silent trainer) — one instance, no advisory-lock reliance
#   worker      — the ONLY Huey consumer (crawl, notifications, style jobs)
#   postgres:16 — tuned; pgbouncer in transaction mode in front
#   redis:7     — rate limits, JWT denylist, cache (AOF)
#   postiz      — OPTIONAL (profiles: [postiz]) social scheduling sidecar
#
# Browser traffic:  your-domain → caddy → web (BFF) → api (docker network)
# Server callbacks: Meta + Paymob → caddy → api directly (fast lane)
#
# Usage (from the repo root):
#   cp deploy/.env.example deploy/.env    # fill EVERYTHING
#   docker compose -f deploy/docker-compose.prod.yml up -d
#   docker compose -f deploy/docker-compose.prod.yml --profile postiz up -d
#
# Capacity math + scaling path: repos/zemest/docs/SCALING.md
# =============================================================================

x-app-base: &app-base
  build:
    context: ../repos/zemest
    dockerfile: Dockerfile
  env_file: .env
  environment: &app-env
    APP_ENV: production
    APP_DEBUG: "false"
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-zemest}:${POSTGRES_PASSWORD:?set in deploy/.env}@pgbouncer:6432/${POSTGRES_DB:-zemest}
    DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-zemest}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-zemest}
    REDIS_URL: redis://redis:6379/0
    # Shared SQLite queue file (WAL, multi-process safe on one host).
    # Mounted on the SAME volume for api/scheduler/worker — without this the
    # worker consumes an empty private file and every task silently runs
    # inline on the API replicas instead.
    HUEY_SQLITE_PATH: /huey/huey_queue.db
    # API replicas: never run queue consumer or scheduler locally —
    # dedicated services own both.
    HUEY_INLINE_CONSUMER: "false"
    SCHEDULER_INLINE_WORKER: "false"
    SILENT_TRAINER_INLINE_WORKER: "false"
    # A dedicated worker container consumes the shared queue → call sites
    # enqueue (durable, exactly-once) instead of inline fallback.
    HUEY_EXTERNAL_WORKER: "true"
  restart: unless-stopped
  depends_on: &app-depends
    db:
      condition: service_healthy
    pgbouncer:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - huey_data:/huey
  ulimits:
    nofile:
      soft: 65536
      hard: 65536
  logging: &default-logging
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

services:
  # ------------------------------------------------------------------ database
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zemest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-zemest}
    # Postiz's role+database get created on first volume init (profile only).
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postiz-init.sh:/docker-entrypoint-initdb.d/20-postiz.sh:ro
    # NO ports: — the database is reachable only inside the compose network.
    command: >
      postgres
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c work_mem=16MB
      -c maintenance_work_mem=256MB
      -c max_connections=300
      -c wal_level=replica
      -c max_wal_size=2GB
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zemest} -d ${POSTGRES_DB:-zemest}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *default-logging

  # -------------------------------------------------------------------- pooler
  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_USER: ${POSTGRES_USER:-zemest}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-zemest}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 40
      RESERVE_POOL_SIZE: 10
      SERVER_RESET_QUERY: DISCARD ALL
      AUTH_TYPE: scram-sha-256
    # NO ports: — apps reach it at pgbouncer:6432 on the compose network.
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U ${POSTGRES_USER:-zemest} -d ${POSTGRES_DB:-zemest}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  # --------------------------------------------------------------------- cache
  redis:
    image: redis:7-alpine
    # NO ports: — internal only. AOF on (rate-limit counters + JWT denylist
    # survive restarts), LRU eviction so a flood of keys can't OOM the box.
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  # ------------------------------------------------- frontend (Next.js + BFF)
  web:
    build:
      context: ..
      dockerfile: Dockerfile.web
      args:
        # NEXT_PUBLIC_* bake in at BUILD time — pass them here, not runtime.
        NEXT_PUBLIC_SITE_URL: ${ZEMEST_DOMAIN:-https://your-domain.com}
        NEXT_PUBLIC_FB_APP_ID: ${FB_APP_ID:-}
    environment:
      # Runtime BFF → backend (server-side only, docker network):
      ZEMEST_BACKEND_URL: http://api:8000
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    logging: *default-logging

  # ------------------------------------------------------------------- api x2
  api:
    <<: *app-base
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      --workers 2 --proxy-headers --forwarded-allow-ips "*"
    # NOTE: /docs is DISABLED in production (APP_ENV=production gates it) —
    # healthcheck probes the root endpoint instead.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    expose:
      - "8000"
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 2g

  # --------------------------------------------------------- scheduler (ONE)
  # Exactly one instance: owns the APScheduler cycles (publish sweep 30 s,
  # silent trainer 45 s, weekly rebuild). API replicas run with the inline
  # workers OFF (see x-app-base) so jobs fire once, period — duplicate cycles
  # would double LLM spend and double-publish posts. Postgres advisory locks
  # (app/services/leader_election.py) remain as a second guard.
  scheduler:
    <<: *app-base
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8001
      --workers 1 --proxy-headers
    environment:
      <<: *app-env
      SCHEDULER_INLINE_WORKER: "true"
      SILENT_TRAINER_INLINE_WORKER: "true"
      HUEY_INLINE_CONSUMER: "false"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    expose:
      - "8001"
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 2g

  # ------------------------------------------------------------- huey worker
  # The ONLY consumer of the shared queue file. Crawls, order notifications,
  # style jobs execute exactly once regardless of API replica count.
  worker:
    <<: *app-base
    command: ["python", "-m", "app.tasks.worker_main"]
    environment:
      <<: *app-env
      HUEY_INLINE_CONSUMER: "false"
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1g


  # ---------------------------------------------------------------------- edge
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      ZEMEST_DOMAIN: ${ZEMEST_DOMAIN:?set in deploy/.env}
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    restart: unless-stopped
    logging: *default-logging

  # -------------------------------------------- OPTIONAL postiz (sidecar)
  # Social scheduling UI + engine. Enable with: --profile postiz
  # Per-tenant sessions in zemest (app/api/postiz.py) — no shared login.
  postiz:
    profiles: ["postiz"]
    image: ghcr.io/gitroomhq/postiz-app:latest
    restart: unless-stopped
    environment:
      MAIN_URL: ${POSTIZ_MAIN_URL:-http://localhost:4007}
      FRONTEND_URL: ${POSTIZ_MAIN_URL:-http://localhost:4007}
      NEXT_PUBLIC_BACKEND_URL: ${POSTIZ_MAIN_URL:-http://localhost:4007}/api
      JWT_SECRET: ${POSTIZ_JWT_SECRET:?set in deploy/.env}
      DATABASE_URL: postgresql://postiz:${POSTIZ_POSTGRES_PASSWORD:?set in deploy/.env}@db:5432/postiz
      REDIS_URL: redis://redis:6379/1
      IS_GENERAL: "true"
      DISABLE_REGISTRATION: "false"
      BACKEND_INTERNAL_URL: http://localhost:4007
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
    volumes:
      - postiz-uploads:/uploads
      - postiz-config:/config/
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "4007"
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  huey_data:
  caddy_data:
  caddy_config:
  postiz-uploads:
  postiz-config:
