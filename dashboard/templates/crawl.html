{% extends "base.html" %}
{% block title %}Crawl Website - Zemest{% endblock %}

{% block content %}
<div class="section-header">
    <h2>Website Crawler</h2>
</div>
<p><small>Crawl your website to automatically extract products, policies, FAQs, and build the AI knowledge base.</small></p>

<article>
    <form id="crawl-form">
        <div class="grid">
            <div>
                <label>Website URL *</label>
                <input type="url" id="crawl-url" required placeholder="https://yourstore.com">
            </div>
            <div>
                <label>Crawl Depth</label>
                <select id="crawl-depth">
                    <option value="1">1 — Homepage only</option>
                    <option value="2" selected>2 — Homepage + linked pages</option>
                    <option value="3">3 — Deep crawl (slower)</option>
                </select>
            </div>
            <div style="display: flex; align-items: flex-end;">
                <button type="submit" id="crawl-btn">Start Crawl</button>
            </div>
        </div>
    </form>
</article>

<div class="section-header">
    <h3>Crawl Jobs</h3>
    <button class="outline secondary" style="padding:0.3rem 0.7rem;" onclick="loadJobs()">Refresh</button>
</div>
<div id="jobs-container"></div>

<script>
const tenantId = '{{ tenant_id }}';
const headers = {'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`};

document.getElementById('crawl-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('crawl-btn');
    btn.disabled = true;
    btn.textContent = 'Starting...';

    const url = document.getElementById('crawl-url').value;
    const depth = parseInt(document.getElementById('crawl-depth').value);

    const resp = await fetch(`/api/tenants/${tenantId}/crawl`, {
        method: 'POST', headers,
        body: JSON.stringify({url, depth})
    });

    btn.disabled = false;
    btn.textContent = 'Start Crawl';

    if (resp.ok) {
        loadJobs();
    } else {
        const err = await resp.json();
        alert(err.detail || 'Failed to start crawl');
    }
});

function statusBadge(status) {
    const colors = {
        pending: 'pending', crawling: 'crawling', indexing: 'indexing',
        completed: 'completed', failed: 'failed'
    };
    return `<span class="badge badge-${colors[status] || 'pending'}">${status}</span>`;
}

function statusIcon(status) {
    return {pending: '⏳', crawling: '🔄', indexing: '📚', completed: '✅', failed: '❌'}[status] || '⏳';
}

async function loadJobs() {
    const resp = await fetch(`/api/tenants/${tenantId}/crawl/jobs`, {headers});
    const jobs = await resp.json();
    const container = document.getElementById('jobs-container');

    if (jobs.length === 0) {
        container.innerHTML = '<p>No crawl jobs yet. Enter a URL above to start crawling.</p>';
        return;
    }

    container.innerHTML = `
        <table>
            <thead>
                <tr>
                    <th></th>
                    <th>URL</th>
                    <th>Status</th>
                    <th>Pages</th>
                    <th>Products</th>
                    <th>Info</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody>
                ${jobs.map(j => `
                    <tr>
                        <td>${statusIcon(j.status)}</td>
                        <td style="max-width:250px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
                            <a href="${j.url}" target="_blank">${j.url}</a>
                        </td>
                        <td>${statusBadge(j.status)}</td>
                        <td>${j.pages_found}</td>
                        <td>${j.products_extracted}</td>
                        <td style="max-width:200px; overflow:hidden; font-size:0.8rem; color:#64748b;">
                            ${j.error_message || (j.status === 'completed' ? 'Success' : j.status === 'crawling' ? 'Discovering URLs...' : j.status === 'indexing' ? 'Extracting products...' : 'Queued')}
                        </td>
                        <td style="white-space:nowrap; font-size:0.85rem;">${new Date(j.created_at).toLocaleDateString('ar-EG')}</td>
                    </tr>
                `).join('')}
            </tbody>
        </table>
    `;

    // Auto-refresh if any jobs are in progress
    const active = jobs.some(j => ['pending', 'crawling', 'indexing'].includes(j.status));
    if (active) {
        setTimeout(loadJobs, 8000);
    }
}

// Pre-fill URL from tenant's website
fetch(`/api/tenants/${tenantId}`, {headers}).then(r => r.json()).then(t => {
    if (t.website_url && !document.getElementById('crawl-url').value) {
        document.getElementById('crawl-url').value = t.website_url;
    }
});

loadJobs();
</script>
{% endblock %}
