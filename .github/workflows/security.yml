name: security
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "17 4 * * 1" # weekly: newly published CVEs vs our pins
permissions:
  contents: read
  # security-events: write is granted ONLY on the zizmor job (SARIF upload)

jobs:
  gitleaks:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history — where the PAT incident lived
          persist-credentials: false # read-only audit, no git push anywhere
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE: only required for orgs — personal account = free

  pip-audit:
    name: python deps (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uvx pip-audit -r repos/zemest/requirements.txt
        # 38 known vulns at G3-audit time; the 2026-09 upgrade batch fixed
        # the runtime ones (jose/multipart/jinja2/dotenv/aiosmtplib/sqladmin/
        # litellm/fastapi-starlette). Remaining advisories are dev-only or
        # unfixed upstream (ecdsa). Flip to gating once fully clean —
        # until then keep continue-on-error so the other jobs still report.
        continue-on-error: true

  npm-audit:
    name: js deps (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm audit --audit-level=high
        # bun.lock stays canonical; this is the CI-only bridge (G3 §2.3)

  zizmor:
    name: workflows (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      # zizmor has no --output flag (SARIF goes to stdout); redirect instead.
      # Version pinned so exit-code semantics can't drift under us.
      - run: uvx zizmor@1.30.0 --format sarif . > zizmor.sarif
      - uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        if: always()
        with:
          sarif_file: zizmor.sarif

  bandit:
    name: python sast-lite (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uvx bandit -r repos/zemest/app -ll -f txt
        # -ll = medium+ only. The 2026-09 batch fixed the last HIGH (B324
        # sha1 in silent_trainer) and MED (B104 0.0.0.0 bind) findings.
