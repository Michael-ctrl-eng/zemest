services:
  # ============================================================
  # Zemest — core services
  # ============================================================
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zemest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zemest_secret}
      POSTGRES_DB: ${POSTGRES_DB:-zemest}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zemest} -d ${POSTGRES_DB:-zemest}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-zemest}:${POSTGRES_PASSWORD:-zemest_secret}@db:5432/${POSTGRES_DB:-zemest}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:-zemest}:${POSTGRES_PASSWORD:-zemest_secret}@db:5432/${POSTGRES_DB:-zemest}
      - REDIS_URL=redis://redis:6379/0
      - POSTIZ_URL=http://postiz:5000
      # Billing rails (post-legacy): payoneer / paymob / usdc_solana.
      # Secrets come from .env (env_file above) — only non-secret defaults
      # are listed here.
      - BILLING_ENABLED=${BILLING_ENABLED:-true}
      - BILLING_WEBHOOK_PUBLIC_URL=${BILLING_WEBHOOK_PUBLIC_URL:-}
      - PAYONEER_API_BASE_URL=${PAYONEER_API_BASE_URL:-https://api.payoneer.com}
      - PAYMOB_BASE_URL=${PAYMOB_BASE_URL:-https://egypt.paymob.com}
      - SOLANA_RPC_URL=${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
      - USDC_MINT_ADDRESS=${USDC_MINT_ADDRESS:-EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v}
      - USDC_TREASURY_WALLET=${USDC_TREASURY_WALLET:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Root health probe (docs are disabled when APP_ENV=production —
      # /docs made this healthcheck fail in prod).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  # HEALED: the old queue services referenced a queue module that no
  # longer exists (the queue moved to Huey — SQLite-native). Replaced by
  # a huey consumer; the inline APScheduler in `app` owns the hourly
  # billing cycle, publish and trainer jobs.
  worker:
    build: .
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-zemest}:${POSTGRES_PASSWORD:-zemest_secret}@db:5432/${POSTGRES_DB:-zemest}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:-zemest}:${POSTGRES_PASSWORD:-zemest_secret}@db:5432/${POSTGRES_DB:-zemest}
      - HUEY_SQLITE_PATH=/data/huey_queue.db
      # External consumer mode: the app process must not start its own.
      - HUEY_INLINE_CONSUMER=false
      - SCHEDULER_INLINE_WORKER=${SCHEDULER_INLINE_WORKER:-true}
      - SILENT_TRAINER_INLINE_WORKER=${SILENT_TRAINER_INLINE_WORKER:-true}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - huey_data:/data
    command: huey_consumer app.tasks.huey_app.huey_app -w 2 -l info

  # ============================================================
  # Postiz — social media scheduler sidecar
  # Handles: FB/IG publishing, insights, best-time-to-post, AI captions
  # ============================================================
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    container_name: postiz
    restart: unless-stopped
    environment:
      MAIN_URL: ${POSTIZ_MAIN_URL:-http://localhost:4007}
      FRONTEND_URL: ${POSTIZ_FRONTEND_URL:-http://localhost:4007}
      NEXT_PUBLIC_BACKEND_URL: ${POSTIZ_BACKEND_URL:-http://localhost:4007/api}
      JWT_SECRET: ${POSTIZ_JWT_SECRET:-change-me-to-random-string-postiz}
      DATABASE_URL: postgresql://postiz-user:postiz-password@postiz-postgres:5432/postiz-db-local
      REDIS_URL: redis://postiz-redis:6379
      BACKEND_INTERNAL_URL: http://localhost:3000
      IS_GENERAL: "true"
      DISABLE_REGISTRATION: "false"
      NOT_SECURED: "true"  # Dev mode — JWT in header instead of httpOnly cookie

      # Storage (local for dev — use Cloudflare R2 for production)
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads

      # Social media credentials (set in .env)
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}

      # AI (optional — Postiz has its own AI caption generator)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      # Misc
      API_LIMIT: 30
    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/
    ports:
      - "4007:5000"
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
    networks:
      - default
      - postiz-network

  postiz-postgres:
    image: postgres:17-alpine
    container_name: postiz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postiz-password
      POSTGRES_USER: postiz-user
      POSTGRES_DB: postiz-db-local
    volumes:
      - postiz-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postiz-user -d postiz-db-local"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - postiz-network

  postiz-redis:
    image: redis:7.2-alpine
    container_name: postiz-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - postiz-redis-data:/data
    networks:
      - postiz-network

volumes:
  postgres_data:
  huey_data:
  postiz-config:
  postiz-uploads:
  postiz-postgres-data:
  postiz-redis-data:

networks:
  postiz-network:
    driver: bridge
